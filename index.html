<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FundMe Social | Share & Support Crowdfunding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F0C29 0%, #302B63 50%, #24243E 100%);
            color: #ffffff;
            padding: 24px 28px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
            padding: 16px 28px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4, #FFE66D);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .logo-icon span {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffeaa7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .logo-main {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4, #FFE66D);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .logo-tagline {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .badge {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 20px;
            border-radius: 50px;
        }

        .user-greeting {
            font-weight: 600;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #FFE66D, #FF6B6B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .login-btn, .logout-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 60px;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            background: transparent;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 12px 32px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.7);
            font-family: inherit;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            color: white;
            box-shadow: 0 4px 15px rgba(78,205,196,0.3);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }

        @media (max-width: 880px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 28px 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(78, 205, 196, 0.5);
        }

        .card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #FFE66D, #FF6B6B, #4ECDC4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* Search and Filter Bar */
        .search-filter-bar {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 2;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 45px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
        }

        .category-filter select {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            cursor: pointer;
        }

        .clear-filters {
            background: rgba(255, 107, 107, 0.2);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .category-chip {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-chip.active {
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
        }

        /* Campaigns Grid */
        .campaigns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .campaign-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            transition: all 0.3s ease;
            position: relative;
        }

        .campaign-card:hover {
            transform: translateY(-4px);
            border-color: #FF6B6B;
        }

        .campaign-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .category-education { background: linear-gradient(135deg, #667eea, #764ba2); }
        .category-environment { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .category-health { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .category-technology { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .category-community { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .category-custom { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        .goal-met-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #27AE60, #2ECC71);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        .donate-btn {
            margin-top: 14px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .donate-btn:disabled {
            background: linear-gradient(135deg, #555, #444);
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #FFE66D;
            font-size: 0.85rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        button {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .doc-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
            border-left: 3px solid #4ECDC4;
        }

        .custom-file-input {
            position: relative;
            width: 100%;
        }

        .custom-file-input input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .custom-file-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            border: 2px dashed rgba(78, 205, 196, 0.5);
            border-radius: 20px;
            padding: 12px 16px;
            cursor: pointer;
        }

        .file-name {
            color: rgba(255, 255, 255, 0.7);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .upload-icon {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .campaign-item, .request-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-approved { background: linear-gradient(135deg, #00B4DB, #0083B0); color: white; }
        .status-pending { background: linear-gradient(135deg, #F2994A, #F2C94C); color: white; }
        .status-rejected { background: linear-gradient(135deg, #EB3349, #F45C43); color: white; }

        .admin-actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            height: 12px;
            margin: 16px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #FF6B6B, #4ECDC4);
            width: 0%;
            height: 100%;
            border-radius: 30px;
            transition: width 0.5s ease;
        }

        .info-note {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 14px;
            text-align: center;
        }

        .alert-banner {
            background: rgba(78, 205, 196, 0.1);
            border-left: 4px solid #4ECDC4;
            padding: 16px 20px;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        hr { margin: 25px 0; border-color: rgba(255, 255, 255, 0.1); }

        /* Video Preview Styles */
        .video-preview-container {
            margin-top: 12px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .video-preview-frame {
            width: 100%;
            height: 200px;
            border: none;
        }

        .video-platform-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 8px;
        }

        .platform-icon {
            font-size: 0.9rem;
        }

        /* Share Modal Styles */
        .share-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .share-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 500;
        }

        .share-btn:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .share-facebook { background: #1877f2; }
        .share-twitter { background: #1da1f2; }
        .share-linkedin { background: #0077b5; }
        .share-whatsapp { background: #25d366; }
        .share-copy { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }

        .share-link-input {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            margin-top: 10px;
            text-align: center;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 48px;
            width: 90%;
            max-width: 500px;
            padding: 40px 36px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            position: relative;
            animation: modalFadeIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h3 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 28px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
        }

        .close-modal:hover {
            color: #FF6B6B;
        }

        .quick-amounts {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .quick-amounts button {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
        }

        .age-display {
            background: rgba(78, 205, 196, 0.2);
            border-radius: 20px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-category-container {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .custom-category-input {
            flex: 2;
        }

        .custom-category-input input {
            padding: 10px 16px;
            border-radius: 40px;
        }

        .add-category-btn {
            padding: 10px 20px;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            white-space: nowrap;
        }

        .stripe-element {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 14px 18px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        
        .stripe-element:focus-within {
            border-color: #4ECDC4;
            box-shadow: 0 0 0 3px rgba(78,205,196,0.2);
        }
        
        .payment-error {
            color: #FF6B6B;
            font-size: 0.8rem;
            margin-top: 10px;
            text-align: center;
        }

        .doc-hint {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }

        .error-msg {
            color: #FF6B6B;
            font-size: 0.75rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .modal-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .modal-switch span {
            color: #4ECDC4;
            cursor: pointer;
            font-weight: 700;
        }

        /* Footer Styles */
        .footer {
            margin-top: 60px;
            padding: 40px 28px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 30px;
        }

        .footer-section h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFE66D, #FF6B6B);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .footer-section p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            font-size: 0.85rem;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 10px;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-block;
        }

        .footer-links a:hover {
            color: #4ECDC4;
            transform: translateX(4px);
        }

        .support-btn-footer {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            margin-top: 10px;
        }

        .support-btn-footer:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,107,107,0.4);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .social-icons span {
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.7;
        }

        .social-icons span:hover {
            opacity: 1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="app-root" class="app-container"></div>

    <script>
        // ============================================
        // STRIPE CONFIGURATION
        // ============================================
        const STRIPE_PUBLISHABLE_KEY = 'pk_test_51RNlJ4QZNxf9XgCiMpOBpsCT441wJia5Ghs9vkXiKZPDzLYnbgEYoBXMy1vDLF5BMguMMlnwRcYT01xYSZt4DAQR00jgxXnwuB';
        
        let stripe = null;
        let cardElement = null;
        
        function initStripe() {
            if (typeof Stripe !== 'undefined' && STRIPE_PUBLISHABLE_KEY) {
                try {
                    stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
                    return true;
                } catch(e) {
                    return false;
                }
            }
            return false;
        }
        
        // ============================================
        // SHARE FUNCTIONALITY
        // ============================================
        const SHARE_URL = encodeURIComponent(window.location.href);
        const SHARE_TITLE = encodeURIComponent('FundMe Social - Crowdfunding Platform');
        const SHARE_DESCRIPTION = encodeURIComponent('Support amazing campaigns and bring ideas to life! Join FundMe Social today.');

        function shareOnFacebook() {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${SHARE_URL}`, '_blank', 'width=600,height=400');
        }

        function shareOnTwitter() {
            window.open(`https://twitter.com/intent/tweet?text=${SHARE_TITLE}&url=${SHARE_URL}`, '_blank', 'width=600,height=400');
        }

        function shareOnLinkedIn() {
            window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${SHARE_URL}`, '_blank', 'width=600,height=400');
        }

        function shareOnWhatsApp() {
            window.open(`https://wa.me/?text=${SHARE_TITLE}%20-%20${SHARE_URL}`, '_blank', 'width=600,height=400');
        }

        async function copyLinkToClipboard() {
            try {
                await navigator.clipboard.writeText(window.location.href);
                showModal('success', { message: 'Link copied to clipboard! Share it with your friends.' });
            } catch (err) {
                showModal('info', { title: 'Copy Failed', message: 'Please manually copy the URL from your browser.' });
            }
        }

        function showShareModal() {
            const modalHtml = `
                <div class="modal-overlay" id="shareModal">
                    <div class="modal">
                        <span class="close-modal" onclick="document.getElementById('shareModal').remove()">&times;</span>
                        <h3>📤 Share FundMe Social</h3>
                        <div class="share-options">
                            <button class="share-btn share-facebook" onclick="shareOnFacebook(); document.getElementById('shareModal').remove();">
                                📘 Share on Facebook
                            </button>
                            <button class="share-btn share-twitter" onclick="shareOnTwitter(); document.getElementById('shareModal').remove();">
                                🐦 Share on Twitter
                            </button>
                            <button class="share-btn share-linkedin" onclick="shareOnLinkedIn(); document.getElementById('shareModal').remove();">

        // ============================================
        // VIDEO PLATFORM DETECTION & EMBED GENERATION
        // ============================================
        function detectVideoPlatform(url) {
            if (!url) return { platform: null, embedUrl: null, isValid: false };
            
            const lowerUrl = url.toLowerCase();
            
            const youtubeRegex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const youtubeMatch = url.match(youtubeRegex);
            if (youtubeMatch) {
                return { platform: 'YouTube', embedUrl: `https://www.youtube.com/embed/${youtubeMatch[1]}`, isValid: true, icon: '▶️' };
            }
            
            const tiktokRegex = /(?:tiktok\.com\/@[\w.-]+\/video\/|tiktok\.com\/v\/)(\d+)/;
            const tiktokMatch = url.match(tiktokRegex);
            if (tiktokMatch) {
                return { platform: 'TikTok', embedUrl: `https://www.tiktok.com/embed/v2/${tiktokMatch[1]}`, isValid: true, icon: '📱' };
            }
            
            const facebookRegex = /(?:facebook\.com\/[^/]+\/videos\/|fb\.watch\/?)(\d+)/;
            const facebookMatch = url.match(facebookRegex);
            if (facebookMatch) {
                return { platform: 'Facebook', embedUrl: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}`, isValid: true, icon: '📘' };
            }
            
            const instagramRegex = /(?:instagram\.com\/p\/|instagram\.com\/reel\/)([a-zA-Z0-9_-]+)/;
            const instagramMatch = url.match(instagramRegex);
            if (instagramMatch) {
                return { platform: 'Instagram', embedUrl: `https://www.instagram.com/p/${instagramMatch[1]}/embed`, isValid: true, icon: '📷' };
            }
            
            const pinterestRegex = /(?:pinterest\.com\/pin\/)(\d+)/;
            const pinterestMatch = url.match(pinterestRegex);
            if (pinterestMatch) {
                return { platform: 'Pinterest', embedUrl: `https://www.pinterest.com/pin/${pinterestMatch[1]}/embed`, isValid: true, icon: '📌' };
            }
            
            const vimeoRegex = /(?:vimeo\.com\/)(\d+)/;
            const vimeoMatch = url.match(vimeoRegex);
            if (vimeoMatch) {
                return { platform: 'Vimeo', embedUrl: `https://player.vimeo.com/video/${vimeoMatch[1]}`, isValid: true, icon: '🎬' };
            }
            
            return { platform: null, embedUrl: null, isValid: false, icon: '❓' };
        }
        
        function getVideoPreviewHtml(url) {
            const detection = detectVideoPlatform(url);
            if (!detection.isValid) {
                return '<div class="info-note" style="color:#FF6B6B;">⚠️ Unsupported video link. Please use YouTube, TikTok, Facebook, Instagram, Pinterest, or Vimeo.</div>';

            return `
                <div class="video-preview-container">
                    <iframe class="video-preview-frame" src="${detection.embedUrl}" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>

                    </div>

            `;
        }

        function validateIDNumber(idNumber) {
            idNumber = String(idNumber).trim().replace(/\s/g, '');
            if (!/^\d{13}$/.test(idNumber)) {
                return { valid: false, message: 'ID number must be 13 digits' };
            }
            const year = parseInt(idNumber.substring(0, 2));
            const month = parseInt(idNumber.substring(2, 4));
            const day = parseInt(idNumber.substring(4, 6));
            if (month < 1 || month > 12) {
                return { valid: false, message: 'Invalid birth month' };
            }
            const birthYear = 1900 + year;
            let age = new Date().getFullYear() - birthYear;
            return {
                valid: true,
                age: age,
                gender: parseInt(idNumber.substring(6, 10)) >= 5000 ? 'Male' : 'Female'
            };
        }

        async function processStripeDonation(campaignId, amount, donorEmail) {
            const campaign = campaigns.find(c => c.id === campaignId);
            if (!campaign) return false;
            
            if (isGoalMet(campaign)) {
                showModal('info', { title: 'Goal Reached', message: 'This campaign has already reached its funding goal. Thank you for your support!' });
                return false;
            }
            
            const newRaised = (campaign.raised || 0) + amount;
            if (newRaised > campaign.goal) {
                const remaining = campaign.goal - (campaign.raised || 0);
                showModal('info', { title: 'Donation Limit', message: `This campaign only needs $${remaining} more to reach its goal. Please enter an amount of $${remaining} or less.` });
                return false;
            }
            
            return new Promise((resolve) => {
                setTimeout(() => {
                    campaign.raised = newRaised;
                    campaign.donorCount = (campaign.donorCount || 0) + 1;
                    saveCampaigns();
                    resolve(true);
                }, 1500);
            });
        }

        // CAMPAIGN SUBMISSION
        // ============================================
        function submitNewCampaign(title, desc, goal, category, videoUrl) {
            if (!currentUser) {
                showModal('info', { title: 'Login Required', message: 'Please login to create a campaign.' });
                return false;
            }
            
            const hasApproved = userHasApprovedCampaign(currentUser.email);
            const hasExistingApproved = campaigns.some(c => c.creatorEmail === currentUser.email && c.status === 'approved');
            const hasExistingPending = campaigns.some(c => c.creatorEmail === currentUser.email && c.status === 'pending');
            
            if (hasApproved || hasExistingApproved) {
                showModal('info', { title: 'Not Allowed', message: 'You already have an approved campaign! Only one campaign per creator.' });
                return false;
            }
            
            if (hasExistingPending) {
                showModal('info', { title: 'Pending Review', message: 'You already have a pending campaign. Please wait for admin decision.' });
                return false;
            }
            
            if (!selectedIdFile || !selectedBusinessFile) {
                showModal('info', { title: 'Missing Documents', message: 'Please upload both Government ID and Business Registration documents.' });
                return false;
            }
            
            const newCampaign = {
                id: Date.now().toString(),
                title: title,
                desc: desc || "No description provided",
                goal: goal,
                raised: 0,
                category: category,
                documents: {
                    id: selectedIdFile,
                    business: selectedBusinessFile,
                    product: selectedProductFile || null
                },
                videoUrl: videoUrl || null,
                status: "pending",
                createdAt: Date.now(),
                creatorEmail: currentUser.email,
                donorCount: 0
            };
            
            campaigns.push(newCampaign);
            saveCampaigns();
            return true;
        }
        
        function approveCampaign(id) {
            const camp = campaigns.find(c => c.id === id);
            if (camp && camp.status === 'pending') {
                camp.status = 'approved';
                saveCampaigns();
                updateUserHasApprovedCampaign(camp.creatorEmail, true);
                showModal('success', { message: '✅ "' + camp.title + '" has been approved!' });
                renderApp();
            }
        }
        
        function rejectCampaign(id) {
            const camp = campaigns.find(c => c.id === id);
            if (camp && camp.status === 'pending') {
                camp.status = 'rejected';
                saveCampaigns();
                showModal('info', { title: 'Campaign Rejected', message: '❌ "' + camp.title + '" has been rejected.' });
                renderApp();
            }
        }

            if (addCatBtn) addCatBtn.addEventListener('click', () => {

            if (addCampCat) addCampCat.addEventListener('click', () => {
                const input = document.getElementById('campNewCategory');
                const name = input.value.trim();

                    if (res.success) {
                        input.value = '';

                if (!btn.disabled) {

                        if (!currentUser) { showModal('info', { title: 'Login Required', message: 'Please login to donate' }); setTimeout(() => showModal('login'), 1500); return; }

                });
            }
            
            const campaignForm = document.getElementById('campaignForm');
            if (campaignForm) {
                campaignForm.removeEventListener('submit', handleFormSubmit);
                campaignForm.addEventListener('submit', handleFormSubmit);
            }
        }
        
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const title = document.getElementById('campTitle').value.trim();
            const desc = document.getElementById('campDesc').value.trim();
            const goal = parseInt(document.getElementById('campGoal').value);
            const category = document.getElementById('campCategory').value;
            const videoUrl = document.getElementById('videoLink').value.trim();
            
            if (!title) {
                showModal('info', { title: 'Missing Field', message: 'Please enter a campaign title.' });
                return;
            }
            if (isNaN(goal) || goal <= 0) {
                showModal('info', { title: 'Invalid Goal', message: 'Please enter a valid goal amount.' });
                return;
            }
            if (!selectedIdFile || !selectedBusinessFile) {
                showModal('info', { title: 'Missing Documents', message: 'Please upload both Government ID and Business Registration documents.' });
                return;
            }
            
            if (videoUrl) {
                const detection = detectVideoPlatform(videoUrl);
                if (!detection.isValid) {
                    showModal('info', { title: 'Unsupported Video Link', message: 'Please use a supported platform: YouTube, TikTok, Facebook, Instagram, Pinterest, or Vimeo.' });
                    return;
                }
            }
            
            const success = submitNewCampaign(title, desc, goal, category, videoUrl);
            if (success) {
                document.getElementById('campaignForm').reset();
                document.getElementById('idFileName').innerText = 'No file chosen';
                document.getElementById('businessFileName').innerText = 'No file chosen';
                document.getElementById('productFileName').innerText = 'No file chosen';
                const vidPreview = document.getElementById('videoPreview');
                if (vidPreview) vidPreview.innerHTML = '';
                selectedIdFile = null;
                selectedBusinessFile = null;
                selectedProductFile = null;
                
                showModal('success', { message: '✅ Campaign submitted! Admin will review your documents.' });
                renderApp();
            }
        }
        
        function renderApp() {
            const root = document.getElementById('app-root');
            if (!root) return;
            
            if (!stripe) {
                initStripe();
            }
            
            const ageShow = currentUser && currentUser.age ? ' (' + currentUser.age + 'y)' : '';
            const greeting = currentUser ? '🔥 ' + currentUser.email.split('@')[0] + ageShow + ' (' + (currentUser.role === 'admin' ? 'Admin' : 'Creator') + ')' : '👋 Welcome';
            const btnText = currentUser ? '🚪 Logout' : '🔐 Login / Register';
            let content = '';
            if (currentTab === 'creator') content = renderCreatorTab();
            else if (currentTab === 'admin') content = renderAdminTab();
            else content = renderExploreTab();
            
            const html = '<div class="header">' +
                '<div class="logo-container"><div class="logo-icon"><span>FM</span></div><div class="logo-text"><div class="logo-main">FundMe Social</div><div class="logo-tagline">Share & Support</div></div></div>' +
                '<div class="badge">⚡ Stripe | Share | Multi-Platform</div>' +
                '<div class="user-info"><span class="user-greeting">' + greeting + '</span><button class="login-btn" id="showLoginBtn">' + btnText + '</button></div></div>' +
                '<div class="tab-bar">' +
                '<button class="tab-btn ' + (currentTab === 'creator' ? 'active' : '') + '" data-tab="creator">✨ Create Campaign</button>' +
                '<button class="tab-btn ' + (currentTab === 'admin' ? 'active' : '') + '" data-tab="admin" id="adminTabBtn" style="' + (!currentUser || currentUser.role !== 'admin' ? 'display:none;' : '') + '">🛡️ Admin Review</button>' +
                '<button class="tab-btn ' + (currentTab === 'explore' ? 'active' : '') + '" data-tab="explore">🌍 Explore & Donate</button></div>' +
                content +
                renderFooter();
            root.innerHTML = html;
            
            const loginBtn = document.getElementById('showLoginBtn');
            if (loginBtn) loginBtn.onclick = () => {
                if (currentUser) {
                    showModal('confirm', { title: 'Logout?', message: 'Are you sure you want to logout?', onConfirm: () => { currentUser = null; saveSession(); renderApp(); showModal('success', { message: 'Logged out successfully!' }); } });
                } else showModal('login');
            };
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.onclick = () => { currentTab = btn.getAttribute('data-tab'); renderApp(); }; });
            attachEvents();
            setupFileInputs();
            
            // Make footer functions globally accessible
            window.showFooterModal = showFooterModal;
            window.showSupportUsModal = showSupportUsModal;
            window.showPlatformDonationModal = showPlatformDonationModal;
            window.showShareModal = showShareModal;
            window.shareOnFacebook = shareOnFacebook;
            window.shareOnTwitter = shareOnTwitter;
            window.shareOnLinkedIn = shareOnLinkedIn;
            window.shareOnWhatsApp = shareOnWhatsApp;
            window.copyLinkToClipboard = copyLinkToClipboard;
        }
        
        initData();
        loadSession();
        renderApp();
    </script>
</body>
</html>
